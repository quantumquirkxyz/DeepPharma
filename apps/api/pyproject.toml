[project]
name = "deeppharma-api"
version = "0.1.0"
description = "DeepPharma API tracer bullet"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "alembic>=1.14,<2.0",
  "pwdlib[argon2]>=0.2,<1.0",
  "PyJWT>=2.9,<3.0",
  "sqlalchemy>=2.0,<2.1",
  "uvicorn[standard]>=0.30,<1.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0,<9.0",
  "httpx>=0.27,<1.0",
  "python-multipart>=0.0.9,<1.0",
  "pytest-cov>=6.0,<7.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
